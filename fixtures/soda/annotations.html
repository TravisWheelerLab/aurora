<!doctype html>
<html>
  <head>
    <link rel="icon" type="image/x-icon" href="ICON_PATH_TARGET"/>
    <style>
      :root {
        --primary-color: cadetblue;
        --darker-primary-color: darkcyan;
        --background-color: white;
      }
      body {
        margin: 0;
        font-family: "Lato", sans-serif;
      }

      .container {
        display: flex;
      }

      .sidebar {
        width: 30px;
        height: 100vh;
        border: 1px solid black;
        overflow-x: hidden;
        transition: width 0.3s ease;
        top: 0;
        position: -webkit-sticky;
        position: sticky;
      }

      .inner-sidebar {
        width: 200px;
      }

      .viz {
        flex-grow: 1;
      }

      .button {
        border: none;
        border-radius: 10px;
        text-decoration: none;
        display: inline-block;
        margin: 1px;
        transition-duration: 0.4s;
        width: 28px;
        height: 28px;
        line-height: 28px;
        text-align: center;
        vertical-align: middle;
        user-select: none;
        cursor: pointer;
        outline: none;
        background: var(--primary-color);
        color: white;
      }

      .button:hover {
        background: var(--darker-primary-color);
      }

      .widget-horizontal {
        padding-left: 20px;
        margin: 10px;
        display: flex;
      }

      .widget-vertical {
        padding-left: 20px;
        margin: 10px;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sidebar" id="sidebar">
        <div class="inner-sidebar">
          <a class="button" style="font-size: 1.5em;" href="INDEX_PATH_TARGET">&#x1F878;</a><br>
          <span class="button" id="toggle">&#xFF0B;</span>

          <div class="widget-vertical">
            <label for="aliThresh">Alignment threshold:</label><br />
            <input type="text" id="aliThresh" rows="15" cols="15" resize="none"></input>
          </div>

          <div class="widget-vertical">
            <label for="confThresh">Confidence threshold:</label><br />
            <input type="text" id="confThresh" rows="15" cols="15" resize="none"></input>
          </div>

          <div class="widget-horizontal">
            <label>
              <input
                type="checkbox"
                id="traceAtTop"
                name="traceAtTop"
                checked
              />
              Trace at top
            </label>
          </div>


          <div class="widget-horizontal">
            <label>
              <input type="checkbox" id="labels" name="labels" checked />
              Labels
            </label>
          </div>

          <div class="widget-horizontal">
            <label>
              <input
                type="checkbox"
                id="onlyTrace"
                name="onlyTrace"
                checked
              />
              Only show trace
            </label>
          </div>

          <div class="widget-horizontal">
            <label>
              <input
                type="checkbox"
                id="onlySelected"
                name="onlySelected"
                checked
              />
              Only show selected
            </label>
          </div>

          <div class="widget-horizontal">
            <label>
              <input type="checkbox" id="showInactive" name="showInactive"/>
              Show inactive columns
            </label>
          </div>

          <div class="widget-horizontal">
            <label>
              <input type="checkbox" id="showSegments" name="showSegments"/>
              Show history segments and blocks.
            </label>
          </div>

          <div class="widget-horizontal">
            <label>
              <input type="checkbox" id="showInversions" name="showInversions"/>
              Highlight Inversions
            </label>
          </div>

          <div class="widget-vertical">
            <label for="regex">Regex:</label><br />
            <input type="text" id="regex" rows="15" cols="15" resize="none"></input>
          </div>
        </div>
      </div>
      <div class="viz"></div>
    </div>
  </body>
</html>
